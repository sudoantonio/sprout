name: System tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://sprout_ci@127.0.0.1:5432/sprout_ci
  MIGRATIONS_DIR: db/migrations
  SPROUT_BASE_URL: http://localhost:8080
  SPROUT_ENVIRONMENT: development
  SPROUT_ENABLE_EXPERIMENTAL_CRYPTO_FOR_DEVELOPMENT: "true"
  SPROUT_BIND_ADDR: 127.0.0.1:8080
  SPROUT_HEALTH_PATH: /health/ready
  SPROUT_CORS_ORIGINS: http://localhost:4173
  SPROUT_EMAIL_OUTBOX_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  SPROUT_ARCHIVE_SIGNING_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
  SPROUT_ARCHIVE_SIGNING_KEY_ID: 11111111-1111-4111-8111-111111111111
  SPROUT_METRICS_TOKEN: ci-metrics-token-not-for-production
  SPROUT_BLOB_DIR: /tmp/sprout-ci/blobs
  SPROUT_ARCHIVE_DIR: /tmp/sprout-ci/archives
  SPROUT_BODY_LIMIT_BYTES: "1024"
  SPROUT_BLOB_MAX_FILE_BYTES: "1024"
  SPROUT_BLOB_PROJECT_QUOTA_BYTES: "4096"
  RUST_LOG: sprout_server=debug,tower_http=debug

jobs:
  system:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:14-bookworm
        env:
          POSTGRES_DB: sprout_ci
          POSTGRES_USER: sprout_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sprout_ci -d sprout_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Build server
        run: cargo build --locked --package sprout-server
      - name: Verify systemd unit hardening
        run: bash scripts/verify-systemd-hardening.sh
      - name: Validate migration files
        id: migrations
        run: scripts/validate-migrations.sh
      - name: Install sqlx-cli
        if: steps.migrations.outputs.present == 'true'
        run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features rustls,postgres
      - name: Apply migrations
        if: steps.migrations.outputs.present == 'true'
        run: scripts/migrate.sh --apply
      - name: Verify migrated schema and behavior
        run: |
          psql "${DATABASE_URL}" --set ON_ERROR_STOP=1 --file db/tests/verify_schema.sql
          bash scripts/validation/hlt03-task-domain.sh
          bash scripts/validation/hlt07-sync.sh
      - name: Run database-backed requirement oracles
        run: |
          cargo test --locked --package sprout-server --test requirements -- --ignored --test-threads=1
          cargo test --locked --package sprout-server --test retention -- --ignored --test-threads=1
          cargo test --locked --package sprout-server --test sync_idempotency -- --ignored --test-threads=1
      - name: Restart PostgreSQL during an in-progress purge
        run: bash tests/system/retention-postgres-restart.sh
      - name: Start server
        run: |
          install -d -m 0700 "${SPROUT_BLOB_DIR}" "${SPROUT_ARCHIVE_DIR}"
          target/debug/sprout-server serve --skip-migrations >"${RUNNER_TEMP}/sprout-server.log" 2>&1 &
          echo "$!" >"${RUNNER_TEMP}/sprout-server.pid"
      - name: Run system tests
        run: tests/system/run.sh
      - name: Show server log on failure
        if: failure()
        run: |
          if [[ -f "${RUNNER_TEMP}/sprout-server.log" ]]; then
            cat "${RUNNER_TEMP}/sprout-server.log"
          fi
      - name: Stop server
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/sprout-server.pid" ]]; then
            pid="$(<"${RUNNER_TEMP}/sprout-server.pid")"
            kill -TERM "${pid}" 2>/dev/null || true
            for _ in $(seq 1 30); do
              if ! kill -0 "${pid}" 2>/dev/null; then
                wait "${pid}" 2>/dev/null || true
                exit 0
              fi
              sleep 1
            done
            echo "server did not complete graceful shutdown in 30 seconds" >&2
            exit 1
          fi

  disposable-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/sprout-web/package-lock.json
      - name: Build disposable validation environment
        run: |
          install -d -m 0700 .validation-evidence
          docker compose -f compose.validation.yml build api validation
          docker compose -f compose.validation.yml up -d postgres api
      - name: Run HLT-12 encrypted Docker journey
        run: |
          docker compose -f compose.validation.yml run --rm validation
      - name: Run HLT-01 and HLT-05 real-backend browser journeys
        working-directory: frontend/sprout-web
        env:
          HLT01_EVIDENCE_PATH: ${{ github.workspace }}/.validation-evidence/hlt05.json
          HLT05_EVIDENCE_PATH: ${{ github.workspace }}/.validation-evidence/hlt05.json
          SPROUT_DEV_API_PROXY_TARGET: http://127.0.0.1:18080
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:e2e -- \
            tests/e2e/hlt01-webauthn.spec.ts \
            tests/e2e/hlt05-real-backend.spec.ts \
            --project=chromium
      - name: Scan populated encrypted blob store
        run: bash scripts/validation/hlt05-filesystem.sh
      - name: Remove validation environment
        if: always()
        run: |
          docker compose -f compose.validation.yml down \
            --volumes --remove-orphans
          rm -rf .validation-evidence
