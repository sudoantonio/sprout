[package]
name = "sprout-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.103"
aes-gcm = "0.11.0"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive"] }
dotenvy = "0.15.7"
futures-util = "0.3.32"
hex = "0.4.3"
http = "1.4.0"
lettre = { version = "0.11.22", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sprout-api-contract = { version = "0.1.0", path = "../../crates/api-contract" }
sprout-application = { version = "0.1.0", path = "../../crates/application" }
sprout-crypto-protocol = { version = "0.1.0", path = "../../crates/crypto-protocol" }
sprout-domain = { version = "0.1.0", path = "../../crates/domain" }
sprout-storage-postgres = { version = "0.1.0", path = "../../crates/storage-postgres" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros"] }
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "limit", "request-id", "sensitive-headers", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "v7", "serde"] }
webauthn-rs = { version = "=0.5.4", default-features = false, features = ["danger-allow-state-serialisation"] }
ed25519-dalek = "3.0.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
