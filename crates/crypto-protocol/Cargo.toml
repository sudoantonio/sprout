[package]
name = "sprout-crypto-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.11.0"
base64 = "0.22.1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
libcrux-ml-dsa = "0.0.10"
libcrux-ml-kem = "0.0.10"
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.18"
uuid = { version = "1.24.0", features = ["v7", "serde", "js"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = { version = "1.9.0", features = ["derive"] }
