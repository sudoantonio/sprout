[package]
name = "sprout-validation-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sprout-validation-crypto"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.0"
anyhow = "1.0.103"
base64 = "0.22.1"
clap = { version = "4.6.2", features = ["derive", "env"] }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sprout-api-contract = { version = "0.1.0", path = "../api-contract" }
sprout-crypto-protocol = { version = "0.1.0", path = "../crypto-protocol" }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
