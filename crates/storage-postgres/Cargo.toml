[package]
name = "sprout-storage-postgres"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.89"
chrono = "0.4.45"
serde = "1.0.228"
serde_json = "1.0.150"
sprout-application = { version = "0.1.0", path = "../application" }
sprout-crypto-protocol = { version = "0.1.0", path = "../crypto-protocol" }
sprout-domain = { version = "0.1.0", path = "../domain" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.18"
uuid = "1.24.0"
