name: sprout-validation

services:
  postgres:
    image: postgres:14-bookworm
    environment:
      POSTGRES_DB: sprout_validation
      POSTGRES_USER: sprout_validation
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprout_validation -d sprout_validation"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["serve"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sprout_validation@postgres:5432/sprout_validation
      SPROUT_BIND_ADDR: 0.0.0.0:8080
      SPROUT_BASE_URL: ${SPROUT_VALIDATION_BASE_URL:-http://localhost:4173}
      SPROUT_CORS_ORIGINS: ${SPROUT_VALIDATION_CORS_ORIGINS:-http://localhost:4173}
      SPROUT_ENVIRONMENT: development
      SPROUT_ENABLE_EXPERIMENTAL_CRYPTO_FOR_DEVELOPMENT: "true"
      SPROUT_EMAIL_OUTBOX_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SPROUT_ARCHIVE_SIGNING_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      SPROUT_ARCHIVE_SIGNING_KEY_ID: 11111111-1111-4111-8111-111111111111
      SPROUT_METRICS_TOKEN: validation-metrics-token-not-for-production
      SPROUT_BODY_LIMIT_BYTES: "8388608"
      SPROUT_BLOB_MAX_FILE_BYTES: "8388608"
      SPROUT_BLOB_PROJECT_QUOTA_BYTES: "33554432"
      RUST_LOG: sprout_server=info,tower_http=info
    ports:
      - "127.0.0.1:18080:8080"

  validation:
    build:
      context: .
      dockerfile: Dockerfile
      target: validation
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8080
      DATABASE_URL: postgresql://sprout_validation@postgres:5432/sprout_validation
      SPROUT_EMAIL_OUTBOX_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HLT05_EVIDENCE_PATH: /evidence/hlt05.json
    volumes:
      - ./.validation-evidence:/evidence
