[advisories]
version = 2
# Build-time dependency of the pinned libcrux hybrid suite; upstream currently
# provides no maintained replacement. The production release gate still
# requires independent cryptographic review evidence.
ignore = ["RUSTSEC-2026-0173"]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
# cargo-deny v2 denies every license not explicitly listed. This intentionally
# excludes proprietary, source-available, and licenses without clear open terms.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
exceptions = [
    { allow = ["MPL-2.0"], name = "base64urlsafedata" },
    { allow = ["MPL-2.0"], name = "webauthn-attestation-ca" },
    { allow = ["MPL-2.0"], name = "webauthn-rs" },
    { allow = ["MPL-2.0"], name = "webauthn-rs-core" },
    { allow = ["MPL-2.0"], name = "webauthn-rs-proto" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
