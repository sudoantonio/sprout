<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('sprout-theme')
          var style = localStorage.getItem('sprout-appearance-style')
          var resolved = 'light'
          if (theme === 'dark') {
            resolved = 'dark'
          } else if (
            theme !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            resolved = 'dark'
          }
          document.documentElement.dataset.theme = resolved
          document.documentElement.dataset.style =
            style === 'tactical' ? 'tactical' : 'default'
        } catch (error) {
          // Ignore storage errors (private mode, blocked storage, etc.)
        }
      })()
    </script>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; child-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types sprout"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173b2c" />
    <meta
      name="description"
      content="Sprout is an end-to-end encrypted workspace for projects and tasks."
    />
    <meta name="application-name" content="Sprout" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Sprout — encrypted project workspace</title>
  </head>
  <body>
    <noscript>Sprout requires JavaScript to decrypt your workspace on this device.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
