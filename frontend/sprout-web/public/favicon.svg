<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .dark-mark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light-mark { display: none; }
      .dark-mark { display: inline; }
    }
  </style>
  <image class="light-mark" width="64" height="64" href="data:image/png;base64,"/>
  <image class="dark-mark" width="64" height="64" href="data:image/png;base64,"/>
</svg>
